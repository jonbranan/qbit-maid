name: test

on:
  push:
    branches:
      - main
      - dev*
  pull_request:

jobs:
  komodo-deploy-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run komodo-deploy.sh tests
        run: python3 -m unittest -v test_komodo_deploy
